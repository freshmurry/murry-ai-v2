name = "murry-ai-v2"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat", "nodejs_aws_esm"]

[env.production.vars]
  APP_NAME = "murry-ai-v2"
  ENVIRONMENT = "production"

# ──────────────────────────────────────────
# Static assets (the React frontend)
# ──────────────────────────────────────────
[env.production.assets]
  directory = "public"
  binding = "ASSETS"

# ──────────────────────────────────────────
# Durable Objects (persistent stateful sessions)
# ──────────────────────────────────────────
[[durable_objects.bindings]]
name = "CONVERSATION_DO"
class_name = "ConversationDurableObject"

[[durable_objects.bindings]]
name = "PROJECT_DO"
class_name = "ProjectDurableObject"

# ──────────────────────────────────────────
# D1 Database (relational metadata store)
# Run: wrangler d1 create murry-ai-db
# ──────────────────────────────────────────
[[env.production.d1_databases]]
binding = "DB"
database_name = "hello-ai"
database_id = "927bd55a77a1bc0a9c344ec45a6eed7e"

# ──────────────────────────────────────────
# R2 Bucket (document storage)
# Run: wrangler r2 bucket create murry-ai-documents
# ──────────────────────────────────────────
[[r2_buckets]]
binding = "R2"
bucket_name = "highstreet-it"

# ──────────────────────────────────────────
# Vectorize (semantic vector search)
# Run: wrangler vectorize create murry-ai-vectors --dimensions=768 --metric=cosine
# ──────────────────────────────────────────
[[vectorize]]
binding = "VECTORIZE"
index_name = "vector-index"

# ──────────────────────────────────────────
# Workers AI (embeddings, vision, OCR)
# ──────────────────────────────────────────
[[ai]]
binding = "AI"

# ──────────────────────────────────────────
# KV Namespace (caching & session state)
# Run: wrangler kv namespace create murry-ai-cache
# ──────────────────────────────────────────
[[kv_namespaces]]
binding = "KV_CACHE"
id = "ba2abda5a6f5414a8fcb1de38bff9ac1"

# ──────────────────────────────────────────
# Workflows (background processing pipelines)
# ──────────────────────────────────────────
[[workflows]]
binding = "DOCUMENT_INGESTION"
script_name = "DocumentIngestionWorkflow"

[[workflows]]
binding = "PROPOSAL_ANALYSIS"
script_name = "ProposalAnalysisWorkflow"
