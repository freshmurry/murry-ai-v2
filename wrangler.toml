name = "murry-ai-v2"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat", "nodejs_aws_esm"]

[env.production.vars]
  APP_NAME = "murry-ai-v2"
  ENVIRONMENT = "production"

# ──────────────────────────────────────────
# Static assets (the React frontend)
# ──────────────────────────────────────────
[env.production.assets]
  directory = "public"
  binding = "ASSETS"

# ──────────────────────────────────────────
# Durable Objects (persistent stateful sessions)
# ──────────────────────────────────────────
[[durable_objects.bindings]]
name = "CONVERSATION_DO"
class_name = "ConversationDurableObject"

[[durable_objects.bindings]]
name = "PROJECT_DO"
class_name = "ProjectDurableObject"

# Required EXports section for Durable Objects
[exports.ConversationDurableObject]
type = "durable-object"
storage = "sqlite"

[exports.ProjectDurableObject]
type = "durable-object"
storage = "sqlite"

# ──────────────────────────────────────────
# D1 Database (relational metadata store)
# ──────────────────────────────────────────
[[env.production.d1_databases]]
binding = "DB"
database_name = "hello-ai"
database_id = "927bd55a77a1bc0a9c344ec45a6eed7e"

# ──────────────────────────────────────────
# R2 Bucket (document storage)
# ──────────────────────────────────────────
[[r2_buckets]]
binding = "R2"
bucket_name = "highstreet-it"

# ──────────────────────────────────────────
# Vectorize (semantic vector search)
# ──────────────────────────────────────────
[[vectorize]]
binding = "VECTORIZE"
index_name = "vector-index"

# ──────────────────────────────────────────
# Workers AI (embeddings, vision, OCR)
# ⚠️ FIX: Must be a simple object with binding property
# ──────────────────────────────────────────
[[ai]]
binding = "AI"

# ──────────────────────────────────────────
# KV Namespace (caching & session state)
# ──────────────────────────────────────────
[[kv_namespaces]]
binding = "KV_CACHE"
id = "ba2abda5a6f5414a8fcb1de38bff9ac1"

# ──────────────────────────────────────────
# Workflows (background processing pipelines)
# ⚠️ FIX: Both 'name' and 'class_name' fields are required
# ──────────────────────────────────────────
[[workflows]]
binding = "DOCUMENT_INGESTION"
class_name = "DocumentIngestionWorkflow"
name = "DocumentIngestionWorkflow"

[[workflows]]
binding = "PROPOSAL_ANALYSIS"
class_name = "ProposalAnalysisWorkflow"
name = "ProposalAnalysisWorkflow"
