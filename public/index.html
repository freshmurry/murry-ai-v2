// ──────────────────────────────────────────
// Simple Markdown Renderer
// ──────────────────────────────────────────

function renderMarkdown(text) {
  if (!text) return '';
  let html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    // Code blocks
    .replace(/```(\w+)?\n?([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code class="language-${lang||'text'}">${code.trim()}</code></pre>`)
    // Inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // Headers
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    // Bold/italic
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // Horizontal rule
    .replace(/^---+$/gm, '<hr/>')
    // Blockquotes
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    // Unordered lists
    .replace(/^[\s]*[-*+•] (.+)$/gm, '<li>$1</li>')
    // Ordered lists
    .replace(/^[\s]*\d+[.)]\s+(.+)$/gm, '<li>$1</li>')
    // Checkboxes
    .replace(/^\[x\] (.+)$/gim, '<li>✅ $1</li>')
    .replace(/^\[ \] (.+)$/gim, '<li>☐ $1</li>')
    // Wrap consecutive <li> in <ul>
    .replace(/((?:<li>.+<\/li>\n?)+)/g, '<ul>$1</ul>')
    // Links
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
    // Line breaks
    .replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br/>');

  // Wrap in paragraph if not already wrapped
  if (!html.startsWith('<')) html = `<p>${html}</p>`;
  return html;
}

function MD({ content, className = '' }) {
  return h('div', {
    className: `prose ${className}`,
    dangerouslySetInnerHTML: { __html: renderMarkdown(content) }

// ──────────────────────────────────────────
// API Client
// ──────────────────────────────────────────

const API_BASE = '';

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body instanceof FormData) { opts.body = body; }
  else if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(`${API_BASE}${path}`, opts);
  if (!res.ok) { const err = await res.json().catch(() => ({ error: res.statusText })); throw new Error(err.error || res.statusText); }
  return res.json();
}

const GET = (path) => api('GET', path);
const POST = (path, body) => api('POST', path, body);
const PUT = (path, body) => api('PUT', path, body);
const DEL = (path) => api('DELETE', path);

// ──────────────────────────────────────────
// RESTful Chat Hook
// ──────────────────────────────────────────
function useChat(conversationId, projectId) {
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const loadMessages = async (convId) => {
    try {
      const conv = await GET(`/api/conversations/${convId}`);
      setMessages(conv.data.messages || []);
    } catch (err) {
      setError(err instanceof Error ? err.message : String(err));
    }
  };

  useEffect(() => {
    if (!conversationId) return;
    loadMessages(conversationId);
  }, [conversationId]);

  const sendMessage = async (content) => {
    if (!conversationId || !content.trim()) return;
    setLoading(true);
    try {
      const r = await POST('/api/chat', { conversation_id: conversationId, project_id: projectId, content });
      setMessages(r.data.messages || []);
    } catch (err) {
      setError(err instanceof Error ? err.message : String(err));
    } finally {
      setLoading(false);
    }
  };

  return { messages, loading, error, sendMessage };
}

// Button
function Btn({ children, onClick, variant = 'default', size = 'md', className = '', disabled, type = 'button', title }) {
  const base = 'inline-flex items-center justify-center gap-2 font-medium rounded-lg transition-all duration-150 cursor-pointer disabled:opacity-40 disabled:pointer-events-none';
  const variants = {
    default: 'bg-[hsl(var(--secondary))] text-[hsl(var(--fg))] hover:bg-[hsl(var(--border))] border border-[hsl(var(--border))] border-transparent',
    primary: 'bg-[hsl(var(--primary))] text-white hover:brightness-110 glow-primary font-semibold',
    ghost: 'hover:bg-[hsl(var(--secondary))] text-[hsl(var(--fg))]',
    danger: 'bg-[hsl(0_72%_51%/0.12)] text-[hsl(0_72%_55%)] border border-[hsl(0_72%_51%/0.3)] hover:bg-[hsl(0_72%_51%/0.2)]',
    success: 'bg-[hsl(142_70%_45%/0.12)] text-[hsl(142_70%_50%)] border border-[hsl(142_70%_45%/0.3)] hover:bg-[hsl(142_70%_45%/0.2)]',
    outline: 'border border-[hsl(var(--border))] hover:bg-[hsl(var(--secondary))] hover:border-[hsl(var(--muted)/0.4)]',
  };
  const sizes = { sm: 'px-2.5 py-1 text-xs', md: 'px-3.5 py-2 text-sm', lg: 'px-5 py-2.5 text-base', icon: 'p-2' };
  return h('button', { type, onClick, className: `${base} ${variants[variant]} ${sizes[size]} ${className}`, disabled, title }, children);
}

// Badge
function Badge({ children, variant = 'default' }) {
  const base = 'inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium';
  const v = {
    default: 'bg-[hsl(var(--secondary))] text-[hsl(var(--muted))]',
    compliant: 'badge-compliant',
    pending: 'badge-pending',
    processing: 'badge-processing',
    error: 'badge-error',
    non_compliant: 'badge-error',
    partial: 'bg-[hsl(38_92%_50%/0.15)] text-[hsl(38_92%_50%)] border border-[hsl(38_92%_50%/0.3)]',
    indexed: 'badge-compliant',
    active: 'badge-processing',
    draft: 'badge-pending',
    answered: 'badge-compliant',
  };
  return h('span', { className: `${base} ${v[variant] || v.default}` }, children);
}

// Input
function Input({ value, onChange, placeholder, className = '', type = 'text', onKeyDown, ref, autoFocus }) {
  return h('input', {
    ref, type, value, onChange: e => onChange(e.target.value), placeholder, autoFocus,
    onKeyDown,
    className: `w-full bg-[hsl(var(--secondary))] border border-[hsl(var(--border))] rounded px-3 py-2 text-sm text-[hsl(var(--fg))] placeholder-[hsl(var(--muted))] focus:border-[hsl(var(--primary))] transition-colors ${className}`
  });
}

// Modal
function Modal({ title, children, onClose, width = 'max-w-lg' }) {
  return h('div', {
    className: 'fixed inset-0 z-50 flex items-center justify-center p-4',
    onClick: e => { if (e.target === e.currentTarget) onClose(); }
  },
    h('div', { className: 'absolute inset-0 bg-black/60 backdrop-blur-sm' }),
    h('div', {
      className: `relative ${width} w-full bg-[hsl(var(--card))] border border-[hsl(var(--border))] rounded-2xl shadow-2xl animate-slide-up`
    },
      h('div', { className: 'flex items-center justify-between px-5 py-4 border-b border-[hsl(var(--border))]' },
        h('h2', { className: 'text-base font-semibold' }, title),
        h(Btn, { variant: 'ghost', size: 'icon', onClick: onClose }, h(Icon, { name: 'x', size: 16 }))
      ),
      h('div', { className: 'p-5' }, children)
    )
  );
}

// ──────────────────────────────────────────
// Upload Drop Zone
// ──────────────────────────────────────────

function UploadZone({ projectId, onUploaded }) {
  const [dragging, setDragging] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [files, setFiles] = useState([]);
  const inputRef = useRef();

  const handleFiles = async (fileList) => {
    setUploading(true);
    const results = [];
    for (const file of fileList) {
      const fd = new FormData();
      fd.append('file', file);
      fd.append('project_id', projectId);
      fd.append('name', file.name.replace(/\.[^/.]+$/, ''));
      try {
        const r = await api('POST', '/api/upload', fd);
        results.push({ name: file.name, status: 'success', doc: r.data.document });
      } catch (err) {
        results.push({ name: file.name, status: 'error', error: err.message });
      }
    }
    setFiles(results);
    setUploading(false);
    onUploaded?.();
  };

  return h('div', null,
    h('div', {
      className: `drop-zone p-8 text-center cursor-pointer ${dragging ? 'dragover' : ''}`,
      onClick: () => inputRef.current?.click(),
      onDragOver: e => { e.preventDefault(); setDragging(true); },
      onDragLeave: () => setDragging(false),
      onDrop: e => { e.preventDefault(); setDragging(false); handleFiles([...e.dataTransfer.files]); },
    },
      h('input', { ref: inputRef, type: 'file', multiple: true, className: 'hidden', accept: '.pdf,.docx,.doc,.pptx,.ppt,.xlsx,.xls,.md,.mdx,.txt,.html,.htm,.png,.jpg,.jpeg,.gif,.webp', onChange: e => handleFiles([...e.target.files]) }),
      uploading
        ? h('div', { className: 'flex flex-col items-center gap-3' },
            h('div', { className: 'w-8 h-8 border-2 border-[hsl(var(--primary))] border-t-transparent rounded-full animate-spin' }),
            h('p', { className: 'text-sm text-[hsl(var(--muted))]' }, 'Uploading and ingesting...')
          )
        : h('div', { className: 'flex flex-col items-center gap-3' },
            h(Icon, { name: 'upload', size: 32, className: 'text-[hsl(var(--muted))]' }),
            h('div', null,
              h('p', { className: 'font-medium text-sm' }, 'Drop files here or click to browse'),
              h('p', { className: 'text-xs text-[hsl(var(--muted))] mt-1' }, 'PDF, DOCX, PPTX, XLSX, MD, TXT, HTML, PNG, JPG and more')
            )
          )
    ),
    files.length > 0 && h('div', { className: 'mt-3 space-y-2' },
      files.map((f, i) => h('div', { key: i, className: 'flex items-center justify-between text-xs p-2 rounded bg-[hsl(var(--secondary))]' },
        h('span', { className: 'truncate' }, f.name),
        h(Badge, { variant: f.status === 'success' ? 'indexed' : 'error' }, f.status === 'success' ? '✓ Queued' : '✗ Failed')
      ))
    )
  );
}

function ToolCallDisplay({ calls }) {

        h('span', { className: 'font-mono text-[hsl(var(--primary))] text-xs' }, tc.name.replace(/_/g, ' ')),
        h('span', { className: 'text-[hsl(var(--muted))] text-xs ml-auto' }, tc.status)

      )

// ──────────────────────────────────────────
// Citation Chips
// ──────────────────────────────────────────

function CitationChips({ citations }) {
  const [expanded, setExpanded] = useState(null);
  if (!citations?.length) return null;
  const unique = citations.filter((c, i, arr) => arr.findIndex(x => x.chunk_id === c.chunk_id) === i);
  return h('div', { className: 'mt-2' },
    h('div', { className: 'flex flex-wrap gap-1.5' },
      unique.map((c, i) => h('button', {
        key: c.chunk_id,
        className: 'citation-pill',
        onClick: () => setExpanded(expanded === i ? null : i),
      },
        h(Icon, { name: 'file', size: 10 }),
        `${c.document_name.substring(0, 25)}${c.document_name.length > 25 ? '…' : ''}`,
        c.page_number && h('span', { className: 'opacity-60' }, `p.${c.page_number}`)
      ))
    ),
    expanded !== null && h('div', {
      className: 'mt-2 p-3 rounded-lg bg-[hsl(var(--secondary))] border border-[hsl(var(--border))] text-xs leading-relaxed animate-fade-in'
    },
      h('p', { className: 'text-[hsl(var(--muted))] mb-1 font-medium' }, unique[expanded].document_name),
      h('p', null, unique[expanded].content?.substring(0, 400), unique[expanded].content?.length > 400 ? '…' : '')
    )
  );
}

// ──────────────────────────────────────────
// Message Bubble
// ──────────────────────────────────────────

function MessageBubble({ message, isStreaming, streamContent, toolCalls }) {
  const [copied, setCopied] = useState(false);
  const isUser = message.role === 'user';
  const content = isStreaming ? streamContent : message.content;

  const copy = () => {
    navigator.clipboard.writeText(content);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  return h('div', { className: `flex gap-3 ${isUser ? 'flex-row-reverse' : 'flex-row'} group animate-fade-in` },
    // Avatar
    h('div', {
      className: `w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center text-sm font-bold ${isUser ? 'bg-[hsl(var(--accent))] text-white' : 'bg-[hsl(var(--primary))] text-black'}`
    }, isUser ? 'U' : '✦'),
    // Content
    h('div', { className: `max-w-[78%] min-w-0 ${isUser ? 'items-end' : 'items-start'} flex flex-col gap-1` },
      // Tool calls (for assistant only)
      !isUser && toolCalls?.length > 0 && h(ToolCallDisplay, { calls: toolCalls }),
      // Message content
      h('div', {
        className: `px-4 py-3 rounded-2xl text-sm leading-relaxed relative ${
          isUser
            ? 'bg-[hsl(var(--accent))] text-white rounded-tr-sm'
            : 'bg-[hsl(var(--card))] border border-[hsl(var(--border))] rounded-tl-sm'
        }`
      },
        isUser
          ? h('p', { className: 'whitespace-pre-wrap break-words' }, content)
          : h(MD, { content }),
        // Typing indicator
        isStreaming && h('span', { className: 'inline-flex gap-1 ml-2 align-middle' },
          h('span', { className: 'typing-dot' }),
          h('span', { className: 'typing-dot' }),
          h('span', { className: 'typing-dot' })
        ),
        // Copy button
        !isStreaming && !isUser && h('button', {
          className: 'absolute top-2 right-2 opacity-0 group-hover:opacity-100 p-1 rounded hover:bg-[hsl(var(--secondary))] transition-all',
          onClick: copy, title: 'Copy'
        }, h(Icon, { name: copied ? 'check' : 'copy', size: 12, className: copied ? 'text-[hsl(142_70%_45%)]' : 'text-[hsl(var(--muted))]' }))
      ),
      // Citations
      !isUser && message.citations?.length > 0 && h(CitationChips, { citations: message.citations }),
      // Timestamp
      h('span', { className: 'text-xs text-[hsl(var(--muted))]' },
        new Date(message.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      )
    )
  );
}

// ──────────────────────────────────────────
// Chat Panel
// ──────────────────────────────────────────

function ChatPanel({ conversationId, projectId, mode, onNewConversation }) {
  const { messages, loading, error, sendMessage } = useChat(conversationId, projectId);
  const [input, setInput] = useState('');
  const [selectedMode, setSelectedMode] = useState(mode || 'general');
  const bottomRef = useRef();
  const textareaRef = useRef();
  const fileInputRef = useRef();
  const [uploading, setUploading] = useState(false);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

  const send = async () => {
    if (!input.trim()) return;
    await sendMessage(input.trim());
    setInput('');
    textareaRef.current?.focus();
  };

  const uploadFromChat = async (file) => {
    if (!file || !projectId || uploading) return;
    setUploading(true);
    try {
      const form = new FormData();
      form.append('file', file);
      form.append('project_id', projectId);
      await api('POST', '/api/upload', form);
      setInput(prev => `${prev}\n[Uploaded ${file.name} to docs]`);
      setTimeout(() => setInput(''), 1500);
    } catch (err) {
      console.error(err);
    } finally {
      setUploading(false);
    }
  };

  const onFileSelected = (e) => {
    const file = e.target.files?.[0];
    if (file) uploadFromChat(file);
    e.target.value = '';
  };

  const modes = [
    { id: 'general', label: 'General', icon: 'chat' },
    { id: 'proposal', label: 'Proposal', icon: 'doc' },
    { id: 'research', label: 'Research', icon: 'search' },
    { id: 'qa', label: 'Q&A', icon: 'list' },
  ];

  return h('div', { className: 'flex flex-col h-full' },
    h('div', { className: 'flex gap-1 px-4 py-2 border-b border-[hsl(var(--border))] bg-[hsl(var(--sidebar))]' },
      modes.map(m => h('button', {
        key: m.id,
        onClick: () => setSelectedMode(m.id),
        className: `flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium transition-all ${selectedMode === m.id ? 'bg-[hsl(var(--primary))] text-black' : 'text-[hsl(var(--muted))] hover:text-[hsl(var(--fg))] hover:bg-[hsl(var(--secondary))]'}`
      }, h(Icon, { name: m.icon, size: 11 }), m.label))
    ),
    h('div', { className: 'flex-1 overflow-y-auto p-4 space-y-3' },
      messages.length === 0 && !loading && h('div', { className: 'flex flex-col items-center justify-center h-full gap-4 py-12 text-center text-[hsl(var(--muted))]' },
        h('strong', null, 'Start your conversation'),
        h('span', { className: 'text-xs' }, 'Upload docs and ask a question to auto-answer from your knowledge base.')
      ),
      messages.map((msg, i) => h(MessageBubble, { key: msg.id || `${i}-${msg.role}`, message: msg })),
      loading && h('div', { className: 'text-xs text-[hsl(var(--muted))] text-center py-2' }, 'Loading...'),
      error && h('div', { className: 'text-xs text-[hsl(0_72%_51%)] text-center py-2' }, error)
    ),
    h('div', { className: 'border-t border-[hsl(var(--border))] p-3 bg-[hsl(var(--sidebar))]' },
      h('div', { className: 'flex gap-2 items-center' },
        h('button', { type: 'button', onClick: () => fileInputRef.current?.click(), className: 'text-[hsl(var(--muted))] hover:text-[hsl(var(--fg))] p-2 rounded-md transition-all' }, h(Icon, { name: 'upload', size: 16 })),
        h('input', { ref: fileInputRef, type: 'file', className: 'hidden', onChange: onFileSelected }),
        h('textarea', {
          ref: textareaRef,
          value: input,
          onChange: e => setInput(e.target.value),
          onKeyDown: e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } },
          placeholder: 'Ask anything about your proposals...',
          className: 'flex-1 bg-[hsl(var(--card))] border border-[hsl(var(--border))] rounded-xl px-3 py-2 text-sm resize-none outline-none',
          rows: 1
        }),
        h(Btn, { variant: 'primary', size: 'icon', onClick: send, disabled: loading || !input.trim() || uploading }, h(Icon, { name: 'send', size: 16 }))
      ),
      h('div', { className: 'text-xs text-[hsl(var(--muted))] mt-1' }, uploading ? 'Uploading...' : 'Enter to send • Shift+Enter for newline')
    )
  );
}

      priority: newQA.priority,
      category: newQA.category,

    load();

  return h('div', { className: 'flex flex-col h-full' },
    h('div', { className: 'px-4 py-3 border-b border-[hsl(var(--border))]' },
      h('div', { className: 'flex items-center justify-between mb-3' },

      h('div', { className: 'grid grid-cols-1 gap-2 md:grid-cols-4 mb-3' },
        h('input', {

function BrainPanel({ projectId, conversationId }) {
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [newEntry, setNewEntry] = useState({ type: 'fact', title: '', content: '' });
  const [filter, setFilter] = useState('');
  const [extracting, setExtracting] = useState(false);
  const [extractMsg, setExtractMsg] = useState('');

  const load = () => {
    setLoading(true);
    GET(`/api/brain?project_id=${projectId}`).then(r => { setEntries(r.data); setLoading(false); }).catch(() => setLoading(false));
  };

  useEffect(load, [projectId]);

  const filtered = entries.filter(e => !filter || (e.title?.toLowerCase().includes(filter.toLowerCase()) || e.content?.toLowerCase().includes(filter.toLowerCase())));

  const autoExtract = async () => {
    if (!conversationId) return;
    setExtracting(true); setExtractMsg('');
    try {
      const r = await POST('/api/brain/extract', { conversation_id: conversationId, project_id: projectId });
      const n = r.data?.extracted?.length || 0;
      setExtractMsg(n > 0 ? `Extracted ${n} new insight(s)` : 'Nothing new worth remembering');
      load();
    } catch (err) { setExtractMsg('Extract failed: ' + (err instanceof Error ? err.message : '')); }
    finally { setExtracting(false); setTimeout(() => setExtractMsg(''), 5000); }
  };

  const save = async () => {
    if (!newEntry.title.trim() || !newEntry.content.trim()) return;
    await POST('/api/brain', { project_id: projectId, type: newEntry.type, title: newEntry.title, content: newEntry.content });
    setNewEntry({ type: 'fact', title: '', content: '' });
    load();
  };

  return h('div', { className: 'flex flex-col h-full' },
    h('div', { className: 'px-4 py-3 border-b border-[hsl(var(--border))]' },
      h('div', { className: 'flex items-center justify-between' },
        h('h3', { className: 'font-semibold text-sm' }, `Brain / Memory (${entries.length})`),
        h(Btn, { variant: 'ghost', size: 'icon', onClick: load }, h(Icon, { name: 'refresh', size: 14 }))
      ),
      h('div', { className: 'mt-2 grid grid-cols-3 gap-2 text-xs' },
        h('select', {
          value: newEntry.type,
          className: 'bg-[hsl(var(--secondary))] border border-[hsl(var(--border))] rounded-lg px-2 py-1 text-xs',
          onChange: e => setNewEntry(prev => ({ ...prev, type: e.target.value }))
        }, ['fact', 'preference', 'process', 'contact', 'insight'].map(t => h('option', { key: t, value: t }, t))),
        h('input', {
          value: newEntry.title,
          onChange: e => setNewEntry(prev => ({ ...prev, title: e.target.value })),
          placeholder: 'Title',
          className: 'col-span-2 bg-[hsl(var(--secondary))] border border-[hsl(var(--border))] rounded-lg px-2 py-1 text-xs'
        })
      ),
      h('textarea', {
        value: newEntry.content,
        onChange: e => setNewEntry(prev => ({ ...prev, content: e.target.value })),
        placeholder: 'Write knowledge entry details here...',
        className: 'w-full mt-2 bg-[hsl(var(--secondary))] border border-[hsl(var(--border))] rounded-lg px-2 py-2 text-xs min-h-[80px] resize-vertical'
      }),
      h('div', { className: 'mt-2 flex items-center justify-between' },
        h('input', {
          value: filter, onChange: e => setFilter(e.target.value),
          placeholder: 'Filter entries...',
          className: 'bg-[hsl(var(--secondary))] border border-[hsl(var(--border))] rounded-lg px-2 py-1 text-xs w-32'
        }),
        h('div', { className: 'flex items-center gap-2' },
          extractMsg && h('span', { className: 'text-xs text-[hsl(var(--muted))]' }, extractMsg),
          conversationId && h(Btn, { size: 'sm', variant: 'ghost', onClick: autoExtract, disabled: extracting, title: 'Auto-extract insights from conversation' }, extracting ? 'Extracting...' : '✨ Auto-Extract'),
          h(Btn, { size: 'sm', variant: 'primary', onClick: save }, 'Save to Brain')
        )
      )
    ),
    h('div', { className: 'flex-1 overflow-y-auto p-3 space-y-2' },
      loading ? [1,2,3].map(i => h('div', { key: i, className: 'shimmer h-16 rounded-xl' })) :
      entries.length === 0 ? h('div', { className: 'text-center py-12 text-[hsl(var(--muted))]' }, 'No brain entries yet.') :
      filtered.map(entry => h('div', { key: entry.id, className: 'border border-[hsl(var(--border))] rounded-xl p-3 bg-[hsl(var(--card))] card-subtle' },
        h('div', { className: 'flex items-center justify-between text-xs text-[hsl(var(--muted))]' },
          h('span', null, entry.type.toUpperCase()),
          h('div', { className: 'flex items-center gap-2' },
            h('span', null, new Date(entry.updated_at).toLocaleDateString()),
            h('button', {
              onClick: async () => { await DEL(`/api/brain/${entry.id}`); load(); },
              className: 'text-[hsl(var(--muted))] hover:text-[hsl(0_72%_51%)] transition-colors text-xs'
            }, '✕')
          )
        ),
        h('h4', { className: 'font-semibold text-sm mt-1' }, entry.title),
        h('p', { className: 'text-xs mt-1 whitespace-pre-wrap' }, entry.content)
      ))
    )
  );
}

// Resizable Split Panel
// ──────────────────────────────────────────

function SplitPanel({ left, right, defaultLeftWidth = 55 }) {
  const [leftWidth, setLeftWidth] = useState(defaultLeftWidth);
  const dragging = useRef(false);
  const containerRef = useRef();

  const onMouseDown = () => { dragging.current = true; };
  useEffect(() => {
    const onMove = (e) => {
      if (!dragging.current || !containerRef.current) return;
      const rect = containerRef.current.getBoundingClientRect();
      const pct = ((e.clientX - rect.left) / rect.width) * 100;
      setLeftWidth(Math.max(25, Math.min(80, pct)));
    };
    const onUp = () => { dragging.current = false; };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    return () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
  }, []);

  return h('div', { ref: containerRef, className: 'flex flex-1 overflow-hidden' },
    h('div', { className: 'overflow-hidden flex flex-col', style: { width: `${leftWidth}%` } }, left),
    h('div', { className: 'panel-divider', onMouseDown }),
    h('div', { className: 'flex-1 overflow-hidden flex flex-col' }, right)
  );
}

function LoginPage() {

  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setLoading(true); setError('');
    try {
      const r = await POST('/api/auth/login', { email, password });

        localStorage.setItem('auth_token', r.data.token);
        localStorage.setItem('auth_user', JSON.stringify(r.data.user || {}));

function ResetPasswordPage() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const [password, setPassword] = useState('');
  const [confirm, setConfirm] = useState('');
  const [error, setError] = useState('');
  const [done, setDone] = useState(false);
  const [loading, setLoading] = useState(false);

  if (!token) return h('div', { className: 'min-h-screen flex items-center justify-center bg-[hsl(var(--bg))] p-4' },
    h('div', { className: 'w-full max-w-sm text-center space-y-4' },
      h('h1', { className: 'text-lg font-semibold text-[hsl(0_72%_51%)]' }, 'Invalid or missing reset link'),
      h('a', { href: '/forgot-password', className: 'text-[hsl(var(--primary))] hover:underline text-sm' }, 'Request a new link'))
  );

  if (done) return h('div', { className: 'min-h-screen flex items-center justify-center bg-[hsl(var(--bg))] p-4' },
    h('div', { className: 'w-full max-w-sm text-center space-y-4' },
      h('div', { className: 'w-12 h-12 rounded-full bg-[hsl(142_70%_45%/0.15)] flex items-center justify-center mx-auto' }, h('span', { className: 'text-xl' }, '✓')),
      h('h1', { className: 'text-lg font-semibold text-[hsl(var(--fg))]' }, 'Password reset!'),
      h('p', { className: 'text-sm text-[hsl(var(--muted))]' }, 'You can now log in with your new password.'),
      h('a', { href: '/login', className: 'text-[hsl(var(--primary))] hover:underline text-sm' }, 'Go to login'))
  );

  const submit = async (e) => {
    e.preventDefault();
    if (password !== confirm) { setError('Passwords do not match'); return; }
    if (password.length < 8) { setError('Password must be at least 8 characters'); return; }
    setLoading(true); setError('');
    try {
      await POST('/api/auth/reset-password', { token, password });
      setDone(true);
    } catch (err) {
      setError(err instanceof Error ? err.message : 'Reset failed');
    } finally { setLoading(false); }
  };

  const inputCls = 'w-full bg-[hsl(var(--secondary))] border border-[hsl(var(--border))] rounded-lg px-3 py-2.5 text-sm text-[hsl(var(--fg))] focus:border-[hsl(var(--primary))] focus:outline-none';

  return h('div', { className: 'min-h-screen flex items-center justify-center bg-[hsl(var(--bg))] p-4' },
    h('div', { className: 'w-full max-w-sm space-y-4' },
      h('h1', { className: 'text-xl font-semibold text-center text-[hsl(var(--fg))]' }, 'Set a new password'),
      h('form', { onSubmit: submit, className: 'space-y-3' },
        h('input', { type: 'password', placeholder: 'New password', value: password, onChange: e => setPassword(e.target.value), className: inputCls, required: true }),
        h('input', { type: 'password', placeholder: 'Confirm password', value: confirm, onChange: e => setConfirm(e.target.value), className: inputCls, required: true }),
        error && h('p', { className: 'text-xs text-[hsl(0_72%_51%)]' }, error),
        h('button', { type: 'submit', disabled: loading,
          className: 'w-full bg-[hsl(var(--primary))] text-black font-medium rounded-lg px-3 py-2.5 text-sm hover:brightness-110 transition-all disabled:opacity-50 cursor-pointer' },
          loading ? 'Resetting...' : 'Reset Password')
      )
    )
  );
}

        [
          { q: 'Can I change plans later?', a: 'Yes — upgrade or downgrade anytime. Changes take effect at the next billing cycle.' },
          { q: 'Is there a free trial?', a: 'The Free plan is free forever with no credit card. Paid plans will offer a trial once billing launches.' },
          { q: 'What happens if I exceed my plan limits?', a: 'You can still view and manage existing proposals. New proposals will be blocked until the next cycle or an upgrade.' },
        ].map((faq) => h('div', { key: faq.q, className: 'border-b border-[hsl(var(--border))] py-4' },
          h('h3', { className: 'text-sm font-medium mb-1' }, faq.q),
          h('p', { className: 'text-xs text-[hsl(var(--muted))]' }, faq.a)
        ))
      )
    )
  );
}

function App() {
  const [darkMode, setDarkMode] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [activeProject, setActiveProject] = useState(null);
  const [activeConv, setActiveConv] = useState(null);
  const [rightTab, setRightTab] = useState('documents');
  const [layout, setLayout] = useState('split'); // 'split' | 'chat' | 'docs'

  // Generate stable conversation ID
  const convId = useMemo(() => activeConv?.id || 'default-conversation', [activeConv]);

  useEffect(() => {
    document.documentElement.className = darkMode ? 'dark' : 'light';
  }, [darkMode]);

  // Auto-create default project on first load
  useEffect(() => {
    GET('/api/projects').then(r => {
      if (r.data?.length > 0) setActiveProject(r.data[0]);
    }).catch(() => {});
  }, []);

  const rightTabs = [
    { id: 'documents', label: 'Documents', icon: 'file' },
    { id: 'qa', label: 'Q&A Tracker', icon: 'list' },
    { id: 'brain', label: 'Brain / Memory', icon: 'brain' },
    { id: 'compliance', label: 'Compliance', icon: 'shield' },
    { id: 'settings', label: 'Settings', icon: 'settings' },
  ];

  const RightPanel = activeProject
    ? (rightTab === 'documents' ? h(DocumentsPanel, { projectId: activeProject.id, key: activeProject.id })
    : rightTab === 'qa' ? h(QAPanel, { projectId: activeProject.id, key: activeProject.id })
    : rightTab === 'brain' ? h(BrainPanel, { projectId: activeProject.id, conversationId: convId, key: activeProject.id })
    : rightTab === 'compliance' ? h(CompliancePanel, { projectId: activeProject.id, key: activeProject.id })
    : rightTab === 'settings' ? h(SettingsPanel, { projectId: activeProject.id, key: activeProject.id })
    : null)
    : h('div', { className: 'flex flex-col items-center justify-center h-full gap-2 text-sm text-[hsl(var(--muted))]' },
        h('div', { className: 'w-12 h-12 rounded-2xl bg-[hsl(var(--secondary))] flex items-center justify-center mb-2' }, h(Icon, { name: 'file', size: 22, className: 'text-[hsl(var(--muted))]' })),
        h('p', { className: 'text-sm font-medium' }, 'Select or create a project'),
        h('p', { className: 'text-xs' }, 'to get started')
      );

  const chatPanel = h(ChatPanel, {
    conversationId: convId,
    projectId: activeProject?.id,
    mode: 'general',
    onNewConversation: () => {}
  });

  const rightPanelFull = h('div', { className: 'flex flex-col h-full' },
    h(TabBar, { tabs: rightTabs, active: rightTab, onChange: setRightTab }),
    h('div', { className: 'flex-1 overflow-hidden' }, RightPanel)
  );

  return h('div', { className: 'flex h-screen overflow-hidden bg-[hsl(var(--bg))] text-[hsl(var(--fg))]' },
    // Sidebar
    h(Sidebar, {
      activeProject, setActiveProject,
      activeConv, setActiveConv,
      sidebarOpen, setSidebarOpen,
      darkMode, toggleDark: () => setDarkMode(d => !d)
    }),
    // Main area
    h('div', { className: 'flex flex-col flex-1 overflow-hidden' },
      // Top bar
      h('div', { className: 'flex items-center gap-3 px-4 py-2.5 border-b border-[hsl(var(--border))] bg-[hsl(var(--sidebar))]' },
        h('button', {
          onClick: () => setSidebarOpen(s => !s),
          className: 'text-[hsl(var(--muted))] hover:text-[hsl(var(--fg))] transition-colors'
        }, h(Icon, { name: 'menu', size: 18 })),
        h('div', { className: 'flex items-center gap-2' },
          activeProject
            ? h('div', { className: 'flex items-center gap-2' },
                h('span', { className: 'text-sm font-semibold' }, activeProject.name),
                h(Badge, { variant: activeProject.status }, activeProject.status)
              )
            : h('span', { className: 'text-sm text-[hsl(var(--muted))]' }, 'No project selected')
        ),
        h('div', { className: 'ml-auto flex items-center gap-2' },
          h('a', { href: '/pricing', className: 'text-xs text-[hsl(var(--muted))] hover:text-[hsl(var(--fg))] transition-colors px-2' }, 'Pricing'),
          h('a', { href: '/login', className: 'text-xs text-[hsl(var(--muted))] hover:text-[hsl(var(--fg))] transition-colors px-2' }, 'Login'),
          // Layout toggles
          [
            { id: 'split', icon: 'workflow', title: 'Split view' },
            { id: 'chat', icon: 'chat', title: 'Chat only' },
            { id: 'docs', icon: 'file', title: 'Documents only' },
          ].map(l => h('button', {
            key: l.id, title: l.title,
            onClick: () => setLayout(l.id),
            className: `p-1.5 rounded-md transition-all ${layout === l.id ? 'bg-[hsl(var(--primary)/0.15)] text-[hsl(var(--primary))]' : 'text-[hsl(var(--muted))] hover:text-[hsl(var(--fg))] hover:bg-[hsl(var(--secondary))]'}`
          }, h(Icon, { name: l.icon, size: 15 })))
        )
      ),
      // Content
      h('div', { className: 'flex-1 overflow-hidden' },
        layout === 'split'
          ? h(SplitPanel, { left: chatPanel, right: rightPanelFull })
          : layout === 'chat'
          ? chatPanel
          : rightPanelFull
      )
    )
  );
}

function Root() {
  const path = window.location.pathname;
  if (path === '/login') return h(LoginPage);
  if (path === '/register') return h(RegisterPage);
  if (path === '/forgot-password') return h(ForgotPasswordPage);
  if (path === '/reset-password') return h(ResetPasswordPage);
  if (path === '/pricing') return h(PricingPage);
  return h(App);
}

createRoot(document.getElementById('root')).render(h(Root));
</script>
</body>
</html>
